[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
lisk-sepolia = "${LISK_SEPOLIA_RPC_URL}"

[etherscan]
lisk-sepolia = { key = "${BLOCKSCOUT_API_KEY}", url = "https://sepolia-blockscout.lisk.com/api?module=contract&action=verifysourcecode", chain_id = 4202 }
